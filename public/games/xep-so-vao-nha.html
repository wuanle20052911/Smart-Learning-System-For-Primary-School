<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xếp số về đúng nhà | MathJoy</title>
  <style>
    :root { font-family: "Trebuchet MS", Arial, sans-serif; color: #26385d; background: #effcf5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; background: radial-gradient(circle at 92% 8%, #ffe6c4 0 10%, transparent 11%), linear-gradient(145deg, #effcf5, #f2f4ff); }
    main { width: min(100%, 780px); margin: 24px auto; padding: clamp(22px, 5vw, 42px); border: 2px solid #d8eddf; border-radius: 28px; background: white; box-shadow: 0 18px 45px #345b4620; }
    .top { display: flex; justify-content: space-between; gap: 12px; color: #39805c; font-size: 13px; font-weight: 800; }
    .home { color: #438360; }
    h1 { margin: 16px 0 8px; color: #285d46; font-size: clamp(28px, 6vw, 42px); }
    p { line-height: 1.65; }
    .counter { display: flex; justify-content: space-between; margin: 20px 0 10px; color: #66718c; font-weight: 800; }
    .target { margin: 14px 0; padding: 16px; border-radius: 16px; background: #fff7dc; font-size: 18px; font-weight: 800; line-height: 1.5; }
    .numbers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .number { min-height: 70px; border: 2px solid #dceae1; background: #f9fffb; color: #326c4c; font-size: 24px; }
    .number.selected { border-color: #438360; background: #e4f8eb; box-shadow: inset 0 0 0 2px #438360; }
    button { padding: 12px; border-radius: 14px; font: inherit; font-weight: 900; cursor: pointer; }
    button:focus-visible { outline: 3px solid #2e7d52; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .55; }
    .primary { min-height: 50px; border: 0; background: #39805c; color: white; font-size: 15px; }
    .primary:hover:not(:disabled) { background: #276b48; }
    .feedback { min-height: 48px; margin: 16px 0; font-weight: 800; line-height: 1.5; }
    .good { color: #21814e; }
    .bad { color: #a45b25; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; }
    .finish { display: none; padding: 24px 0 4px; text-align: center; }
    @media (max-width: 560px) { body { padding: 12px; } main { margin: 12px auto; border-radius: 20px; } .top { flex-direction: column; } .numbers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <div class="top"><span>🏠 TOÁN LỚP 4 · PHÂN LOẠI SỐ</span><a class="home" href="/learn">← Về bài học</a></div>
    <h1>Xếp số về đúng nhà</h1>
    <p>Chọn tất cả những số thuộc ngôi nhà được yêu cầu. Chạm lại để bỏ chọn.</p>
    <section id="play">
      <div class="counter"><span id="round"></span><span id="score"></span></div>
      <div id="target" class="target"></div>
      <div id="numbers" class="numbers" aria-label="Các số cần phân loại"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="actions"><button id="check" class="primary" type="button">Kiểm tra ngôi nhà</button><button id="next" class="primary" type="button" hidden>Chặng tiếp →</button></div>
    </section>
    <section id="finish" class="finish" aria-live="polite"><div style="font-size:64px">🏡</div><h2>Hai ngôi nhà đã gọn gàng!</h2><p id="finish-score"></p><button class="primary" type="button" onclick="location.reload()">Chơi lại</button></section>
  </main>
  <script>
    const rounds = [
      { target: 'chẵn', numbers: [12, 35, 48, 71, 90, 103], answers: [12, 48, 90] },
      { target: 'lẻ', numbers: [24, 57, 66, 81, 120, 305], answers: [57, 81, 305] },
      { target: 'chẵn', numbers: [208, 431, 572, 900, 1001, 2026], answers: [208, 572, 900, 2026] }
    ];
    let index = 0;
    let score = 0;
    let selected = new Set();
    let completed = false;
    const numbers = document.getElementById('numbers');
    const feedback = document.getElementById('feedback');
    const check = document.getElementById('check');
    const next = document.getElementById('next');
    function render() {
      const round = rounds[index];
      selected = new Set();
      completed = false;
      document.getElementById('round').textContent = `Chặng ${index + 1}/${rounds.length}`;
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      document.getElementById('target').textContent = `🏠 Chọn tất cả các số ${round.target} để xếp vào đúng nhà.`;
      feedback.textContent = '';
      feedback.className = 'feedback';
      check.hidden = false;
      check.disabled = false;
      next.hidden = true;
      numbers.replaceChildren(...round.numbers.map((value) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'number';
        button.textContent = value.toLocaleString('vi-VN');
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', () => toggle(value, button));
        return button;
      }));
    }
    function toggle(value, button) {
      if (completed) return;
      if (selected.has(value)) selected.delete(value);
      else selected.add(value);
      button.classList.toggle('selected', selected.has(value));
      button.setAttribute('aria-pressed', String(selected.has(value)));
      feedback.textContent = '';
      feedback.className = 'feedback';
    }
    check.addEventListener('click', () => {
      const round = rounds[index];
      const correct = selected.size === round.answers.length && round.answers.every((value) => selected.has(value));
      if (!correct) {
        feedback.textContent = 'Chưa đúng. Nhìn chữ số tận cùng của từng số rồi thử lại!';
        feedback.className = 'feedback bad';
        return;
      }
      completed = true;
      score += 1;
      feedback.textContent = `Chính xác! Các số tận cùng bằng ${round.target === 'chẵn' ? '0, 2, 4, 6 hoặc 8' : '1, 3, 5, 7 hoặc 9'} thuộc nhà số ${round.target}.`;
      feedback.className = 'feedback good';
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      check.hidden = true;
      if (index === rounds.length - 1) {
        document.getElementById('play').hidden = true;
        document.getElementById('finish-score').textContent = `Con phân loại đúng cả ${score}/${rounds.length} chặng.`;
        document.getElementById('finish').style.display = 'block';
      } else next.hidden = false;
    });
    next.addEventListener('click', () => { index += 1; render(); });
    render();
  </script>
</body>
</html>
