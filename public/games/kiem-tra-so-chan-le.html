<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trạm số chẵn, số lẻ | MathJoy</title>
  <style>
    :root { font-family: "Trebuchet MS", Arial, sans-serif; color: #26385d; background: #f0f7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; background: radial-gradient(circle at 8% 8%, #fff1c8 0 10%, transparent 11%), linear-gradient(145deg, #eff8ff, #f8f2ff); }
    main { width: min(100%, 720px); margin: 24px auto; padding: clamp(22px, 5vw, 42px); border: 2px solid #d5e4f6; border-radius: 28px; background: white; box-shadow: 0 18px 45px #34547b20; }
    .top { display: flex; justify-content: space-between; gap: 12px; color: #6f62c8; font-size: 13px; font-weight: 800; }
    .home { color: #5e4bc4; }
    h1 { margin: 16px 0 8px; color: #263a67; font-size: clamp(28px, 6vw, 42px); }
    p { line-height: 1.65; }
    .rule { margin: 20px 0; padding: 15px 18px; border-radius: 16px; background: #fff7dc; line-height: 1.6; }
    .progress { height: 10px; overflow: hidden; border-radius: 9px; background: #e8edf7; }
    .progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #62c78e, #4a9bd2); transition: width .2s ease; }
    .counter { display: flex; justify-content: space-between; margin: 14px 0; color: #66718c; font-weight: 800; }
    .number { margin: 24px 0; color: #243d70; font-size: clamp(54px, 14vw, 88px); font-weight: 900; text-align: center; letter-spacing: .04em; }
    .question { text-align: center; font-size: 20px; font-weight: 800; }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    button { min-height: 58px; padding: 12px 16px; border: 2px solid #dce5f3; border-radius: 15px; background: #f9fbff; color: #30466d; font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; }
    button:hover:not(:disabled) { border-color: #7967d6; background: #f3f0ff; }
    button:focus-visible { outline: 3px solid #3626bd; outline-offset: 3px; }
    button:disabled { cursor: default; opacity: .7; }
    .feedback { min-height: 48px; margin: 16px 0; font-weight: 800; line-height: 1.5; text-align: center; }
    .good { color: #21814e; }
    .bad { color: #a45b25; }
    .actions { display: flex; justify-content: flex-end; }
    .primary { border-color: #5948b0; background: #6959c9; color: white; }
    .primary:hover:not(:disabled) { background: #5544b5; }
    .finish { display: none; padding: 24px 0 4px; text-align: center; }
    @media (max-width: 560px) { body { padding: 12px; } main { margin: 12px auto; border-radius: 20px; } .top { flex-direction: column; } .answers { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="top"><span>🚦 TOÁN LỚP 4 · SỐ CHẴN VÀ SỐ LẺ</span><a class="home" href="/learn">← Về bài học</a></div>
    <h1>Trạm số chẵn, số lẻ</h1>
    <p>Giúp các bạn qua trạm bằng cách nhìn chữ số tận cùng của mỗi số.</p>
    <div class="rule"><b>Mẹo:</b> Số có chữ số tận cùng là 0, 2, 4, 6, 8 là số chẵn. Tận cùng là 1, 3, 5, 7, 9 là số lẻ.</div>
    <section id="play">
      <div class="progress" aria-label="Tiến độ"><span id="bar"></span></div>
      <div class="counter"><span id="counter"></span><span id="score"></span></div>
      <div id="number" class="number"></div>
      <p class="question">Số này là số chẵn hay số lẻ?</p>
      <div class="answers"><button type="button" data-answer="chẵn">🟦 Số chẵn</button><button type="button" data-answer="lẻ">🟨 Số lẻ</button></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="actions"><button id="next" class="primary" type="button" disabled>Trạm tiếp theo →</button></div>
    </section>
    <section id="finish" class="finish" aria-live="polite"><div style="font-size:64px">🌟</div><h2 id="finish-title"></h2><p id="finish-score"></p><button class="primary" type="button" onclick="location.reload()">Chơi lại</button></section>
  </main>
  <script>
    const rounds = [
      { number: 24, answer: 'chẵn' },
      { number: 37, answer: 'lẻ' },
      { number: 108, answer: 'chẵn' },
      { number: 215, answer: 'lẻ' },
      { number: 460, answer: 'chẵn' },
      { number: 999, answer: 'lẻ' },
      { number: 1246, answer: 'chẵn' },
      { number: 7321, answer: 'lẻ' }
    ];
    let index = 0;
    let score = 0;
    let locked = false;
    const number = document.getElementById('number');
    const feedback = document.getElementById('feedback');
    const next = document.getElementById('next');
    const buttons = [...document.querySelectorAll('[data-answer]')];
    function render() {
      locked = false;
      number.textContent = rounds[index].number.toLocaleString('vi-VN');
      document.getElementById('counter').textContent = `Trạm ${index + 1}/${rounds.length}`;
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      document.getElementById('bar').style.width = `${(index / rounds.length) * 100}%`;
      feedback.textContent = '';
      feedback.className = 'feedback';
      buttons.forEach((button) => { button.disabled = false; });
      next.disabled = true;
      next.textContent = index === rounds.length - 1 ? 'Về đích →' : 'Trạm tiếp theo →';
    }
    buttons.forEach((button) => button.addEventListener('click', () => {
      if (locked) return;
      locked = true;
      const round = rounds[index];
      const digit = round.number % 10;
      const correct = button.dataset.answer === round.answer;
      if (correct) score += 1;
      buttons.forEach((item) => { item.disabled = true; });
      feedback.textContent = `${correct ? 'Chính xác! ' : 'Cùng nhìn lại nhé. '}${digit} là chữ số tận cùng nên ${round.answer === 'chẵn' ? 'số này là số chẵn' : 'số này là số lẻ'}.`;
      feedback.classList.add(correct ? 'good' : 'bad');
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      next.disabled = false;
    }));
    next.addEventListener('click', () => {
      index += 1;
      if (index < rounds.length) return render();
      document.getElementById('play').hidden = true;
      document.getElementById('finish-title').textContent = score === rounds.length ? 'Qua trạm xuất sắc!' : 'Con đã đến đích!';
      document.getElementById('finish-score').textContent = `Con nhận biết đúng ${score}/${rounds.length} số.`;
      document.getElementById('finish').style.display = 'block';
    });
    render();
  </script>
</body>
</html>
