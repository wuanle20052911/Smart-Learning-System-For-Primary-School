<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mật mã chữ số cuối | MathJoy</title>
  <style>
    :root { font-family: "Trebuchet MS", Arial, sans-serif; color: #293857; background: #f6f2ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; background: radial-gradient(circle at 92% 8%, #ffebc7 0 10%, transparent 11%), linear-gradient(145deg, #f5f2ff, #eefaff); }
    main { width: min(100%, 740px); margin: 24px auto; padding: clamp(22px, 5vw, 42px); border: 2px solid #e4dcf5; border-radius: 28px; background: white; box-shadow: 0 18px 45px #4c3b7320; }
    .top { display: flex; justify-content: space-between; gap: 12px; color: #6954bc; font-size: 13px; font-weight: 800; }
    .home { color: #5e4bc4; }
    h1 { margin: 16px 0 8px; color: #38346f; font-size: clamp(28px, 6vw, 42px); }
    p { line-height: 1.65; }
    .counter { display: flex; justify-content: space-between; margin: 20px 0 10px; color: #66718c; font-weight: 800; }
    .vault { margin: 20px 0; padding: 24px 18px; border: 2px dashed #b5a7e8; border-radius: 18px; background: #f8f5ff; text-align: center; }
    .vault span { display: block; color: #7765cf; font-size: 12px; font-weight: 900; letter-spacing: .1em; }
    .vault strong { display: block; margin-top: 6px; color: #38346f; font-size: clamp(44px, 11vw, 70px); letter-spacing: .06em; }
    .question { min-height: 52px; font-size: 19px; font-weight: 800; text-align: center; }
    .answers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    button { min-height: 54px; padding: 10px; border: 2px solid #e2def1; border-radius: 14px; background: #faf9ff; color: #433c72; font: inherit; font-size: 18px; font-weight: 900; cursor: pointer; }
    button:hover:not(:disabled) { border-color: #7967d6; background: #f1efff; }
    button:focus-visible { outline: 3px solid #3626bd; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .7; }
    .feedback { min-height: 48px; margin: 16px 0; font-weight: 800; line-height: 1.5; text-align: center; }
    .good { color: #21814e; }
    .bad { color: #a45b25; }
    .actions { display: flex; justify-content: flex-end; }
    .primary { min-height: 50px; padding: 10px 18px; border: 0; background: #6959c9; color: white; font-size: 15px; }
    .primary:hover:not(:disabled) { background: #5544b5; }
    .finish { display: none; padding: 24px 0 4px; text-align: center; }
    @media (max-width: 560px) { body { padding: 12px; } main { margin: 12px auto; border-radius: 20px; } .top { flex-direction: column; } .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main>
    <div class="top"><span>🔐 TOÁN LỚP 4 · BÍ QUYẾT CHỮ SỐ TẬN CÙNG</span><a class="home" href="/learn">← Về bài học</a></div>
    <h1>Mật mã chữ số cuối</h1>
    <p>Mở chiếc rương bằng cách tìm chữ số tận cùng, rồi xác định số chẵn hay số lẻ.</p>
    <section id="play">
      <div class="counter"><span id="mission"></span><span id="score"></span></div>
      <div class="vault"><span>MÃ SỐ CẦN GIẢI</span><strong id="number"></strong></div>
      <p id="question" class="question"></p>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="actions"><button id="next" class="primary" type="button" disabled>Tiếp tục →</button></div>
    </section>
    <section id="finish" class="finish" aria-live="polite"><div style="font-size:64px">🗝️</div><h2 id="finish-title"></h2><p id="finish-score"></p><button class="primary" type="button" onclick="location.reload()">Giải lại mật mã</button></section>
  </main>
  <script>
    const missions = [
      { number: 8734, parity: 'chẵn', digits: [4, 3, 8, 2] },
      { number: 3409, parity: 'lẻ', digits: [9, 0, 4, 7] },
      { number: 1250, parity: 'chẵn', digits: [0, 5, 2, 8] },
      { number: 7315, parity: 'lẻ', digits: [5, 1, 3, 0] },
      { number: 2002, parity: 'chẵn', digits: [2, 0, 4, 7] }
    ];
    let index = 0;
    let score = 0;
    let phase = 'digit';
    let locked = false;
    const question = document.getElementById('question');
    const answers = document.getElementById('answers');
    const feedback = document.getElementById('feedback');
    const next = document.getElementById('next');
    function render() {
      const mission = missions[index];
      locked = false;
      phase = 'digit';
      document.getElementById('mission').textContent = `Mật mã ${index + 1}/${missions.length}`;
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      document.getElementById('number').textContent = mission.number.toLocaleString('vi-VN');
      question.textContent = 'Chữ số tận cùng của số này là chữ số nào?';
      feedback.textContent = '';
      feedback.className = 'feedback';
      next.disabled = true;
      next.textContent = 'Tiếp tục →';
      showOptions(mission.digits.map(String));
    }
    function showOptions(options) {
      answers.replaceChildren(...options.map((value) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = value;
        button.addEventListener('click', () => answer(value));
        return button;
      }));
    }
    function answer(value) {
      if (locked) return;
      const mission = missions[index];
      const expected = phase === 'digit' ? String(mission.number % 10) : mission.parity;
      const correct = value === expected;
      if (correct) score += 1;
      locked = true;
      [...answers.children].forEach((button) => { button.disabled = true; });
      feedback.className = `feedback ${correct ? 'good' : 'bad'}`;
      if (phase === 'digit') {
        feedback.textContent = `${correct ? 'Mã số đúng! ' : `Chữ số cuối là ${mission.number % 10}. `}Giờ hãy xác định tính chẵn lẻ.`;
        phase = 'parity';
        locked = false;
        question.textContent = `${mission.number.toLocaleString('vi-VN')} là số chẵn hay số lẻ?`;
        showOptions(['chẵn', 'lẻ']);
        document.getElementById('score').textContent = `⭐ ${score} điểm`;
        return;
      }
      feedback.textContent = `${correct ? 'Mở khóa thành công! ' : 'Cùng nhớ lại nhé. '}${mission.number % 10} là chữ số tận cùng, nên số này là số ${mission.parity}.`;
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      next.disabled = false;
      next.textContent = index === missions.length - 1 ? 'Mở rương →' : 'Mật mã tiếp theo →';
    }
    next.addEventListener('click', () => {
      index += 1;
      if (index < missions.length) return render();
      document.getElementById('play').hidden = true;
      document.getElementById('finish-title').textContent = 'Chiếc rương đã mở!';
      document.getElementById('finish-score').textContent = `Con giải đúng ${score}/10 bước mật mã.`;
      document.getElementById('finish').style.display = 'block';
    });
    render();
  </script>
</body>
</html>
