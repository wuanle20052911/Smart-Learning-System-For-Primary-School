<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đường đua sắp xếp | MathJoy</title>
  <style>
    :root { font-family: "Trebuchet MS", Arial, sans-serif; color: #293857; background: #f2f7ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; background: radial-gradient(circle at 8% 8%, #fff1c8 0 10%, transparent 11%), linear-gradient(145deg, #eff8ff, #f8f2ff); }
    main { width: min(100%, 760px); margin: 24px auto; padding: clamp(22px, 5vw, 42px); border: 2px solid #d5e4f6; border-radius: 28px; background: white; box-shadow: 0 18px 45px #34547b20; }
    .top { display: flex; justify-content: space-between; gap: 12px; color: #5874bb; font-size: 13px; font-weight: 800; }
    .home { color: #5e4bc4; }
    h1 { margin: 16px 0 8px; color: #263a67; font-size: clamp(28px, 6vw, 42px); }
    p { line-height: 1.65; }
    .counter { display: flex; justify-content: space-between; margin: 20px 0 10px; color: #66718c; font-weight: 800; }
    .prompt { margin: 14px 0; padding: 16px; border-radius: 16px; background: #fff7dc; font-weight: 800; }
    .items { display: grid; gap: 9px; padding: 0; list-style: none; }
    .item { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; min-height: 62px; padding: 10px; border: 2px solid #dce5f3; border-radius: 14px; background: #f9fbff; }
    .number { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #e8edff; color: #4559a4; font-weight: 900; }
    .value { font-size: 20px; font-weight: 900; }
    .moves { display: flex; gap: 5px; }
    button { min-width: 40px; min-height: 40px; padding: 8px; border: 0; border-radius: 10px; background: #e9edfa; color: #48577e; font: inherit; font-size: 18px; font-weight: 900; cursor: pointer; }
    button:hover:not(:disabled) { background: #dce4ff; }
    button:focus-visible { outline: 3px solid #3626bd; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .5; }
    .primary { min-height: 50px; padding: 10px 18px; border: 0; background: #5d69c8; color: white; font-size: 15px; }
    .primary:hover:not(:disabled) { background: #4a54ac; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .feedback { min-height: 48px; margin: 16px 0; font-weight: 800; line-height: 1.5; }
    .good { color: #21814e; }
    .bad { color: #a45b25; }
    .finish { display: none; padding: 24px 0 4px; text-align: center; }
    @media (max-width: 560px) { body { padding: 12px; } main { margin: 12px auto; border-radius: 20px; } .top { flex-direction: column; } .value { font-size: 17px; } }
  </style>
</head>
<body>
  <main>
    <div class="top"><span>🪨 TOÁN LỚP 4 · SẮP XẾP ĐẾN 100 000</span><a class="home" href="/learn">← Về bài học</a></div>
    <h1>Đường đua sắp xếp</h1>
    <p>Xếp các hòn đá mang số theo thứ tự từ bé đến lớn để giúp các bạn qua cầu.</p>
    <section id="play">
      <div class="counter"><span id="round"></span><span id="score"></span></div>
      <div id="prompt" class="prompt"></div>
      <ol id="items" class="items" aria-label="Các số cần sắp xếp tăng dần"></ol>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="actions"><button id="check" class="primary" type="button">Kiểm tra thứ tự</button><button id="next" class="primary" type="button" hidden>Chặng tiếp →</button></div>
    </section>
    <section id="finish" class="finish" aria-live="polite"><div style="font-size:64px">🏁</div><h2 id="finish-title"></h2><p id="finish-score"></p><button class="primary" type="button" onclick="location.reload()">Chơi lại</button></section>
  </main>
  <script>
    const rounds = [
      { numbers: [45100, 8999, 67400, 15230] },
      { numbers: [75000, 10001, 40000, 19999] },
      { numbers: [55050, 99999, 5505, 30500] }
    ];
    let index = 0;
    let score = 0;
    let numbers = [];
    let completed = false;
    const items = document.getElementById('items');
    const feedback = document.getElementById('feedback');
    const check = document.getElementById('check');
    const next = document.getElementById('next');
    function render() {
      numbers = [...rounds[index].numbers];
      completed = false;
      document.getElementById('round').textContent = `Chặng ${index + 1}/${rounds.length}`;
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      document.getElementById('prompt').textContent = 'Dùng mũi tên để xếp các số theo thứ tự tăng dần.';
      feedback.textContent = '';
      feedback.className = 'feedback';
      check.hidden = false;
      check.disabled = false;
      next.hidden = true;
      drawItems();
    }
    function drawItems() {
      items.replaceChildren(...numbers.map((value, position) => {
        const row = document.createElement('li');
        row.className = 'item';
        const order = document.createElement('span');
        order.className = 'number';
        order.textContent = String(position + 1);
        const number = document.createElement('span');
        number.className = 'value';
        number.textContent = value.toLocaleString('vi-VN');
        const moves = document.createElement('span');
        moves.className = 'moves';
        [-1, 1].forEach((direction) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = direction < 0 ? '↑' : '↓';
          button.setAttribute('aria-label', `${direction < 0 ? 'Đưa lên' : 'Đưa xuống'} số ${value.toLocaleString('vi-VN')}`);
          button.disabled = completed || position + direction < 0 || position + direction >= numbers.length;
          button.addEventListener('click', () => move(position, direction));
          moves.append(button);
        });
        row.append(order, number, moves);
        return row;
      }));
    }
    function move(position, direction) {
      if (completed) return;
      const target = position + direction;
      if (target < 0 || target >= numbers.length) return;
      [numbers[position], numbers[target]] = [numbers[target], numbers[position]];
      drawItems();
    }
    check.addEventListener('click', () => {
      const correct = numbers.every((value, position) => position === 0 || numbers[position - 1] < value);
      if (!correct) {
        feedback.textContent = 'Chưa đúng thứ tự. So sánh từng cặp số liền nhau rồi thử lại nhé.';
        feedback.className = 'feedback bad';
        return;
      }
      completed = true;
      score += 1;
      feedback.textContent = 'Chính xác! Các số đã được xếp từ bé đến lớn.';
      feedback.className = 'feedback good';
      document.getElementById('score').textContent = `⭐ ${score} điểm`;
      check.hidden = true;
      if (index === rounds.length - 1) {
        document.getElementById('play').hidden = true;
        document.getElementById('finish-title').textContent = 'Con đã về đích!';
        document.getElementById('finish-score').textContent = `Con sắp xếp đúng ${score}/${rounds.length} chặng.`;
        document.getElementById('finish').style.display = 'block';
      } else next.hidden = false;
      drawItems();
    });
    next.addEventListener('click', () => { index += 1; render(); });
    render();
  </script>
</body>
</html>
